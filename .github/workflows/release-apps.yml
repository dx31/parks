name: Release apps

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Require API_PROD_URL secret
        env:
          API_PROD_URL: ${{ secrets.API_PROD_URL }}
        run: |
          if [ -z "$API_PROD_URL" ]; then
            echo "Falta el secreto API_PROD_URL."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Build operator and client APKs
        env:
          API_PROD_URL: ${{ secrets.API_PROD_URL }}
        run: bash scripts/build_android_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            apps/operator/build/app/outputs/flutter-apk/app-release.apk
            apps/client/build/app/outputs/flutter-apk/app-release.apk
